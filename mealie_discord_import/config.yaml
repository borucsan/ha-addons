# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Mealie Discord Import
version: "1.0.6"
slug: mealie_discord_import
description: Discord bot that imports recipes into Mealie from shared links
url: "https://github.com/borucsan/ha-addons/tree/main/mealie_discord_import"
arch:
  - aarch64
  - amd64
init: false
panel_icon: mdi:food-variant
panel_title: Mealie Discord Import
options:
  discord_token: ""
  discord_guild_id: ""
  discord_command_prefix: "!mealie"
  mealie_base_url: ""
  mealie_api_token: ""
  mealie_username: ""
  mealie_password: ""
  bot_log_level: "INFO"
  bot_timeout: 30
  default_recipe_tags: "Discord Import,Verify"
  require_instructions: true
  require_ingredients: true
  openai_api_key: ""
  ai_enabled: false
  ai_model: "gpt-3.5-turbo"
schema:
  discord_token: password
  discord_guild_id: str?
  discord_command_prefix: str?
  mealie_base_url: str
  mealie_api_token: password
  mealie_username: str?
  mealie_password: password?
  bot_log_level: str?
  bot_timeout: int?
  default_recipe_tags: str?
  require_instructions: bool?
  require_ingredients: bool?
  openai_api_key: password?
  ai_enabled: bool?
  ai_model: str?
