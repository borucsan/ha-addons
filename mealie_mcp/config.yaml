# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Mealie MCP Server
version: "1.0.0"
slug: mealie_mcp
description: MCP server (Streamable HTTP) that gives AI assistants access to Mealie
url: "https://github.com/borucsan/ha-addons/tree/main/mealie_mcp"
arch:
  - aarch64
  - amd64
init: false
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: MCP endpoint (Streamable HTTP, path /mcp)
options:
  mealie_base_url: ""
  mealie_api_key: ""
  auth_token: ""
  enable_ai_import: false
  log_level: "INFO"
schema:
  mealie_base_url: url
  mealie_api_key: password
  auth_token: password
  enable_ai_import: bool?
  log_level: list(DEBUG|INFO|WARNING|ERROR|CRITICAL)?
