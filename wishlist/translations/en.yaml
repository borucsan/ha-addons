configuration:
  timezone:
    name: Timezone
    description: Timezone passed to the Wishlist container (TZ environment variable), e.g. Europe/Warsaw.
  origin:
    name: Origin URL
    description: >-
      The URL your users will connect to, e.g. https://wishlist.example.com or
      http://192.168.2.10:3280. Leave empty when using HA ingress.
  token_time:
    name: Token expiry (hours)
    description: Number of hours until signup and password-reset tokens expire.
  default_currency:
    name: Default currency
    description: Global default currency ISO code (e.g. USD, EUR, PLN). Can be overridden per item.
  max_image_size:
    name: Max image size (bytes)
    description: Maximum size of uploaded images in bytes. Default is 5000000 (5 MB).
  header_auth_enabled:
    name: Enable header authentication (HA SSO)
    description: >-
      When enabled, Wishlist reads HA Supervisor's injected user headers and logs in the
      visiting HA user automatically. The user must already exist in Wishlist with a matching username.
  header_username:
    name: Username header
    description: >-
      HTTP header name carrying the username. Default (X-Remote-User-Name) matches
      what HA Supervisor injects via ingress.
  header_name:
    name: Display name header
    description: >-
      HTTP header name carrying the user's full name. Default (X-Remote-User-Display-Name)
      matches what HA Supervisor injects via ingress.
  header_email:
    name: Email header
    description: >-
      HTTP header name carrying the user's email. Leave empty when using native HA ingress
      (HA does not send an email header; auto-registration is skipped but existing users still log in).
