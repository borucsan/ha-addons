configuration:
  timezone:
    name: Timezone
    description: Timezone passed to the Wishlist container (TZ environment variable), e.g. Europe/Warsaw.
  origin:
    name: Origin URL
    description: >-
      Leave empty (recommended): SvelteKit builds the public URL from proxy headers
      (X-Forwarded-Host / X-Forwarded-Proto) so ingress, a custom domain, and direct :3280
      all work and form posts pass CSRF checks. Set a single full URL only if you must pin
      one site (e.g. https://wishlist.example.com) and do not mix other entry points.
  token_time:
    name: Token expiry (hours)
    description: Number of hours until signup and password-reset tokens expire.
  default_currency:
    name: Default currency
    description: Global default currency ISO code (e.g. USD, EUR, PLN). Can be overridden per item.
  max_image_size:
    name: Max image size (bytes)
    description: Maximum size of uploaded images in bytes. Default is 5000000 (5 MB).
  header_auth_enabled:
    name: Enable header authentication (HA SSO)
    description: >-
      When enabled, Wishlist trusts the same header names (see below) for auto-login. Use this
      for HA ingress and household SSO. If you also expose a public domain, strip or overwrite
      those headers on your public reverse proxy (e.g. Nginx Proxy Manager custom config) so
      anonymous visitors are not seen as HA users. Users must already exist in Wishlist with a
      matching username unless email-based auto-registration is configured.
  header_username:
    name: Username header
    description: >-
      HTTP header name carrying the username. Default (X-Remote-User-Name) matches
      what HA Supervisor injects via ingress.
  header_name:
    name: Display name header
    description: >-
      HTTP header name carrying the user's full name. Default (X-Remote-User-Display-Name)
      matches what HA Supervisor injects via ingress.
  header_email:
    name: Email header
    description: >-
      HTTP header name carrying the user's email. Leave empty when using native HA ingress
      (HA does not send an email header; auto-registration is skipped but existing users still log in).
