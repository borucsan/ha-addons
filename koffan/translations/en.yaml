configuration:
  timezone:
    name: Timezone
    description: Timezone passed to the Koffan container (TZ environment variable).
  default_lang:
    name: Default language
    description: >
      Default UI language on first load.
      Supported values: pl, en, de, es, fr, pt, uk, no, lt, el, sk, ru.
  api_token:
    name: API token
    description: >
      Secret token to enable the REST API. Leave empty to disable the API.
