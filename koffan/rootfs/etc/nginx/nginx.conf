daemon off;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    # HA ingress cookies can exceed the default 8 KiB header limit (HTTP 431).
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;

    # htmx follows HX-Redirect (e.g. /lists/5 after creating a list) via
    # location.href, so the path needs the ingress prefix.
    map $upstream_http_hx_redirect $ha_hx_redirect {
        ""      "";
        "~^/"   "$http_x_ingress_path$upstream_http_hx_redirect";
        default $upstream_http_hx_redirect;
    }

    upstream koffan {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    server {
        listen 8080;

        # Serve the ingress base-path patch script directly (no proxying to Go app).
        # The <head> sub_filter below injects a reference to this file so it runs
        # before any other scripts on every page.
        location = /_ha_patch.js {
            alias /ha-ingress-patch.js;
            default_type application/javascript;
            add_header Cache-Control "no-cache, no-store";
        }

        # WebSocket endpoint — separate location for upgrade handling
        location = /ws {
            proxy_pass http://koffan;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Ingress-Path $http_x_ingress_path;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Vendored libraries (htmx, Alpine, Sortable) are passed through untouched:
        # htmx reads document.location.href, which the rewrites below would break.
        location ~ ^/static/.*\.min\.js$ {
            proxy_pass http://koffan;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://koffan;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Ingress-Path $http_x_ingress_path;

            # Strip backend compression so sub_filter can process the body
            proxy_set_header Accept-Encoding "";

            # Rewrite Location headers from backend redirects
            proxy_redirect ~^/(.*)$ $http_x_ingress_path/$1;

            proxy_hide_header HX-Redirect;
            add_header HX-Redirect $ha_hx_redirect always;

            # URLs passed to fetch/XHR/WebSocket/history are fixed at runtime by
            # ha-ingress-patch.js. Reads of location.pathname and navigation via
            # location.href cannot be intercepted, so Koffan's own scripts and
            # inline handlers are pointed at the __haLoc shim from that script.
            sub_filter_once off;
            sub_filter_types text/javascript application/javascript;
            sub_filter 'location.pathname' '__haLoc.pathname';
            sub_filter 'location.href = '  '__haLoc.href = ';

            # Inject the base-path patch script as the very first thing in <head>.
            # $http_x_ingress_path is expanded by nginx so the src is already the
            # full ingress URL — no further rewriting needed for this tag.
            sub_filter '<head>' "<head><script src=\"$http_x_ingress_path/_ha_patch.js\"></script>";

            # Rewrite HTML attributes that are consumed by the browser before JS runs
            # (stylesheet/script/image loading, navigation links, form actions).
            sub_filter 'src="/'    'src="$http_x_ingress_path/';
            sub_filter 'href="/'   'href="$http_x_ingress_path/';
            sub_filter 'action="/' 'action="$http_x_ingress_path/';
        }
    }
}
