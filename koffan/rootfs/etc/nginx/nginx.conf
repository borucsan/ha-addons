daemon off;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;

    upstream koffan {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    server {
        listen 8080;

        # WebSocket endpoint — separate location for upgrade handling
        location = /ws {
            proxy_pass http://koffan;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Ingress-Path $http_x_ingress_path;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://koffan;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Ingress-Path $http_x_ingress_path;

            # Strip backend compression so sub_filter can process the body
            proxy_set_header Accept-Encoding "";

            # Rewrite Location headers from backend redirects
            proxy_redirect ~^/(.*)$ $http_x_ingress_path/$1;

            # Rewrite absolute paths in HTML and inline JS responses.
            # $http_x_ingress_path is empty on direct port access → no-op.
            sub_filter_once off;
            sub_filter_types text/html text/javascript application/javascript;

            # Static assets
            sub_filter 'src="/'       'src="$http_x_ingress_path/';
            sub_filter 'href="/'      'href="$http_x_ingress_path/';
            sub_filter 'action="/'    'action="$http_x_ingress_path/';

            # htmx request attributes
            sub_filter 'hx-get="/'      'hx-get="$http_x_ingress_path/';
            sub_filter 'hx-post="/'     'hx-post="$http_x_ingress_path/';
            sub_filter 'hx-put="/'      'hx-put="$http_x_ingress_path/';
            sub_filter 'hx-delete="/'   'hx-delete="$http_x_ingress_path/';
            sub_filter 'hx-patch="/'    'hx-patch="$http_x_ingress_path/';
            sub_filter 'hx-push-url="/' 'hx-push-url="$http_x_ingress_path/';

            # WebSocket (htmx-ws)
            sub_filter 'ws-connect="/' 'ws-connect="$http_x_ingress_path/';

            # JavaScript fetch() calls (Alpine.js components use these instead of htmx attrs).
            # Three variants: single-quoted, double-quoted, template literal (backtick).
            sub_filter "fetch('/"  "fetch('$http_x_ingress_path/";
            sub_filter 'fetch("/'  'fetch("$http_x_ingress_path/';
            sub_filter 'fetch(`/'  'fetch(`$http_x_ingress_path/';

            # Inline JS — service worker registration
            sub_filter "register('/"  "register('$http_x_ingress_path/";
        }
    }
}
